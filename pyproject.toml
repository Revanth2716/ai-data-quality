[project]
name = "ai-data-quality"
version = "1.0.0"
description = "Lightweight FastAPI service that profiles CSV datasets, detects data-quality issues and statistical anomalies, scores quality, and generates an AI explanation of the computed analysis."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AI Data Quality API contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
